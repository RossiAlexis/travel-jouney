name = "travel-journal"
main = "workers/app.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "travel-journal-db"
database_id = "4cdc38b4-94f7-4d05-a536-ee4618ed6f00"
# Wrangler only reads *.sql files in this folder (not Prisma's nested migration folders).
migrations_dir = "d1/migrations"

[vars]
NODE_ENV = "production"

[dev]
port = 8787
local_protocol = "http"
